name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt "radicale>=3.3,<4"

      - name: Lint
        run: ruff check .

      - name: Start Radicale for the integration tests
        run: |
          mkdir -p /tmp/radicale/collections
          sed 's|/data/collections|/tmp/radicale/collections|; s|0.0.0.0:5232|127.0.0.1:5232|' \
            dev/radicale.conf > /tmp/radicale.conf
          radicale --config /tmp/radicale.conf &
          for _ in $(seq 30); do
            curl -sf -o /dev/null -X OPTIONS http://127.0.0.1:5232/ && exit 0
            sleep 1
          done
          echo "Radicale did not start" >&2
          exit 1

      - name: Test
        run: pytest -q
        env:
          RADICALE_TEST_URL: http://127.0.0.1:5232

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
